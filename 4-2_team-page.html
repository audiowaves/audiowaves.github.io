<!DOCTYPE html>
<html lang="en-US">

  <head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  html {
    background-color: #4c7453;
    font-family: sans-serif, arial;
    color: #e4e3d3;
  }
  ul {
    list-style-type: none;
    margin: 0;
    padding: 0;
    border: 0;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    overflow: hidden;
    background-color: #66956a;
  }
  ul li {
    float: left;
  }
  ul li a {
    display: block;
    color: #e4e3d3;
    text-align: center;
    padding: 14px 16px;
    text-decoration: none;
  }
  ul li a:hover {
    background-color: #517f5d;
  }
  ul li a.active {
    background-color: #6d9e71;
  }
  h1 {
    margin: 60px 10px;
  }
</style>
  </head>
  
  <body>
    <ul>
      <li><a href="">Home</a></li>
      <li><a href="">Services</a></li>
      <li><a href="" class="active">Staff</a></li>
      <li><a href="">Contact</a></li>
    </ul>

    <h1>The Executive Team</h1>
  </body>
</html>
