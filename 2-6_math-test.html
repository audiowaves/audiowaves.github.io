<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>2.6 Math Test</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width; initial-scale=1.0">
  </head>
  <body>
    <h1>2.6 Math Test</h1>
    <textarea placeholder="Enter your name here."></textarea>
    <!--test start-->
    <h4>Question 1</h4><!--Correct=A-->
    <p>Solve the indefinite integral. </br>
  &int; (<i>x</i> / &radic;(<i>x</i>&sup2; + 4)) <i>dx</i></p>
    <form>
      <input type="radio" name="q1" value="A">&radic;(<i>x</i>&sup2; + 4) + <i>C</i></br>
      <input type="radio" name="q1" value="B">2x&sup2; tan(<i>x</i>) + <i>C</i></br>
      <input type="radio" name="q1" value="C">x&radic;(<i>x</i> + 4) + <i>C</i></br>
      <input type="radio" name="q1" value="D">ln&vert; <i>x</i>&sup2; + 4 &vert; + <i>C</i></br>
    </form>
    <h4>Question 2</h4><!--Correct=D-->
    <p>Evaluate the definite integral. Answer in exact form.</br>
  &int;&sub1;&sup5;(<i>x</i> ln(<i>x</i>) <i>dx</i></p>
    <form>
      <input type="radio" name="q2" value="A">4 + 25 ln(4)</br>
      <input type="radio" name="q2" value="B">(25/2)ln(5) - 13/2</br>
      <input type="radio" name="q2" value="C">50 ln(5) - 6</br>
      <input type="radio" name="q2" value="D">-6 + (25/2)ln(5)</br>
    </form>
  </body>
</html>
